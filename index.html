<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Warna & ukuran utama
   ========================================================= */
:root{
  --red:#a3101f;
  --red-deep:#7d0a16;
  --red-soft:#c8283a;
  --cream:#fbf5ec;
  --paper:#fffdf8;
  --gold:#d6a943;
  --ink:#5a0d14;
  --pink:#f4c6cc;
  --script:'Great Vibes', cursive;
  --serif:'Cormorant Garamond', Georgia, serif;
  --hand:'Caveat', cursive;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--red);
  color:var(--ink);
  font-family:var(--serif);
  overflow:hidden;
  user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* Kain merah bertekstur halus */
.felt{
  background:
    radial-gradient(120% 90% at 50% 40%, rgba(255,255,255,.06), transparent 60%),
    radial-gradient(circle at 20% 80%, rgba(0,0,0,.18), transparent 50%),
    var(--red);
}

/* =========================================================
   Sistem halaman
   ========================================================= */
.scene{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;
  transform:scale(1.03);
  transition:opacity .8s ease, transform .8s ease, visibility 0s .8s;
  overflow:hidden;
}
.scene.active{
  opacity:1;visibility:visible;transform:none;
  transition:opacity .8s ease, transform .8s ease, visibility 0s;
}

.back{
  position:absolute;top:max(16px, env(safe-area-inset-top));left:16px;z-index:50;
  font-family:var(--serif);font-style:italic;font-size:18px;
  color:var(--cream);opacity:.85;
  padding:6px 14px;border:1px solid rgba(255,255,255,.4);border-radius:999px;
  backdrop-filter:blur(4px);
  transition:transform .2s, opacity .2s;
}
.back:hover{opacity:1;transform:translateX(-3px)}

.link{
  font-family:var(--serif);font-style:italic;font-size:20px;
  text-decoration:underline;text-underline-offset:5px;
  color:inherit;
  animation:breathe 2s ease-in-out infinite;
}
@keyframes breathe{50%{opacity:.55}}

.script{font-family:var(--script);font-weight:400;line-height:1.1}

/* =========================================================
   1. COVER — amplop merah dengan segel lilin
   ========================================================= */
#cover .card{
  position:relative;
  width:min(880px, 92vw);
  aspect-ratio:16/10;
  background:var(--cream);
  border-radius:14px;
  box-shadow:0 30px 60px rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3%;
  padding:4%;
}
#cover h1{font-size:clamp(34px, 6.5vw, 64px);color:var(--red)}
#cover .hint{font-size:clamp(14px,1.8vw,18px);font-style:italic;color:var(--red-soft)}

.envelope{
  position:relative;
  width:min(380px, 52vw);
  aspect-ratio:1.5;
  perspective:900px;
  filter:drop-shadow(0 14px 18px rgba(80,0,10,.35));
}
.envelope .body{
  position:absolute;inset:0;border-radius:6px;
  background:linear-gradient(160deg,#c21a2c,#940c1b);
  overflow:hidden;
}
.envelope .body::before,.envelope .body::after{
  content:"";position:absolute;bottom:0;width:60%;height:100%;
  background:linear-gradient(180deg,#b01526,#8a0a18);
}
.envelope .body::before{left:0;clip-path:polygon(0 0,100% 100%,0 100%)}
.envelope .body::after{right:0;clip-path:polygon(100% 0,100% 100%,0 100%)}
.envelope .flap{
  position:absolute;left:0;right:0;top:0;height:62%;
  background:linear-gradient(180deg,#d22437,#a51022);
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;
  transition:transform .9s cubic-bezier(.6,.05,.3,1);
  z-index:3;
}
.envelope.open .flap{transform:rotateX(180deg);z-index:1}
.envelope .peek{
  position:absolute;left:8%;right:8%;top:10%;height:80%;
  background:var(--paper);border-radius:4px;z-index:2;
  transition:transform 1s .5s cubic-bezier(.3,1.4,.5,1);
  display:flex;align-items:flex-start;justify-content:center;padding-top:6%;
  font-family:var(--script);font-size:clamp(20px,3vw,30px);color:var(--red);
}
.envelope.open .peek{transform:translateY(-55%)}
.envelope .body{z-index:2}
.envelope .peek{z-index:1}
.envelope.open .peek{z-index:2}
.envelope.open .body{z-index:3}

.seal{
  position:absolute;left:50%;top:62%;
  width:22%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%, #fbe7a6 0 12%, transparent 40%),
    radial-gradient(circle, #e2b752 0 55%, #b8862a 70%, #d9ab44 80%, #a8771f 100%);
  box-shadow:0 3px 6px rgba(0,0,0,.35), inset 0 -3px 6px rgba(120,70,0,.4);
  z-index:5;
  display:grid;place-items:center;
  cursor:pointer;
  animation:pulse 1.8s ease-in-out infinite;
  transition:transform .4s, opacity .5s;
}
.seal::after{
  content:"♥";font-size:clamp(14px,3vw,30px);color:#a7781f;
  text-shadow:0 1px 0 #f7dc8d, 0 -1px 0 #8c6216;
}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.08)}}
.envelope.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(90deg);animation:none}

.doodle{position:absolute;stroke:var(--red);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.doodle.gift{left:5%;bottom:8%;width:13%;animation:bob 3s ease-in-out infinite}
.doodle.balloons{right:6%;bottom:16%;width:12%;animation:bob 3.6s ease-in-out infinite reverse}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}

/* =========================================================
   2. HERO — foto + "Happy Birthday [Name]!"
   ========================================================= */
#hero{color:#fff;text-align:center;flex-direction:column}
#hero .bg{
  position:absolute;inset:-20px;
  background-size:cover;background-position:center;
  filter:saturate(.9);
  animation:kenburns 18s ease-in-out infinite alternate;
}
@keyframes kenburns{to{transform:scale(1.12) translate(-2%,-1%)}}
#hero .tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(120,10,25,.35),rgba(110,5,20,.65))}
#hero .content{position:relative;z-index:2;padding:0 20px}
#hero .date{font-size:clamp(14px,2vw,20px);letter-spacing:.15em;opacity:.9}
#hero h1{font-size:clamp(46px,10vw,110px);text-shadow:0 4px 20px rgba(0,0,0,.35);margin:6px 0}
#hero p{font-size:clamp(16px,2.4vw,24px);font-style:italic;opacity:.95}
#hero .link{display:inline-block;margin-top:9vh;color:#fff}
#hero .doodle{stroke:#fff}
#hero .letters span{display:inline-block;opacity:0;transform:translateY(30px) rotate(8deg);animation:pop .6s forwards}
@keyframes pop{to{opacity:1;transform:none}}

/* =========================================================
   3. MENU — "These are for you"
   ========================================================= */
#menu{flex-direction:column;color:var(--cream)}
#menu h2{font-size:clamp(44px,8vw,84px);margin-bottom:6vh}
.gifts{display:flex;gap:clamp(24px,8vw,110px);align-items:flex-end;justify-content:center;flex-wrap:wrap;padding:0 16px}
.gift-item{display:flex;flex-direction:column;align-items:center;gap:14px;transition:transform .3s}
.gift-item svg{width:clamp(110px,18vw,190px);height:auto;filter:drop-shadow(0 12px 14px rgba(0,0,0,.3));transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.gift-item:hover svg{transform:translateY(-10px) rotate(-5deg) scale(1.06)}
.gift-item span{font-size:clamp(18px,2.4vw,24px);font-style:italic;letter-spacing:.04em}
.gift-item.done span::after{content:" ✓";font-style:normal;color:var(--gold)}
.gift-item:nth-child(1) svg{animation:wiggle 4s ease-in-out infinite}
.gift-item:nth-child(2) svg{animation:wiggle 4s ease-in-out .6s infinite}
.gift-item:nth-child(3) svg{animation:wiggle 4s ease-in-out 1.2s infinite}
@keyframes wiggle{0%,85%,100%{rotate:0deg}90%{rotate:-6deg}95%{rotate:6deg}}

/* =========================================================
   4. MESSAGE — amplop renda + polaroid
   ========================================================= */
#message .bg{
  position:absolute;inset:-30px;background-size:cover;background-position:center;
  filter:blur(6px) saturate(.8);opacity:.85;
}
#message .tint{position:absolute;inset:0;background:rgba(214,120,135,.55);mix-blend-mode:multiply}
#message .tint2{position:absolute;inset:0;background:rgba(255,220,225,.25)}

.lace-env{
  position:absolute;left:4%;bottom:6%;
  width:min(330px,46vw);aspect-ratio:1.1;
  cursor:pointer;z-index:5;
  transition:transform .3s;
  rotate:-8deg;
}
.lace-env:hover{transform:scale(1.04)}
.lace-env .pocket{
  position:absolute;left:0;right:0;bottom:0;height:62%;
  background:linear-gradient(160deg,#c41b2e,#8c0a18);
  border-radius:4px;
  box-shadow:0 14px 24px rgba(60,0,10,.35);
}
.lace-env .pocket::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(200deg,#b01526,#7f0815);
  clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);
}
.lace-env .card-in{
  position:absolute;left:12%;right:12%;top:0;height:70%;
  background:#fff;
  rotate:-4deg;
  display:grid;place-items:center;
  font-style:italic;font-size:clamp(14px,2vw,19px);color:var(--red);text-decoration:underline;text-underline-offset:4px;
  /* tepi renda */
  -webkit-mask:
    radial-gradient(circle 9px at 9px 9px,#000 98%,transparent) 0 0/18px 18px repeat-x,
    linear-gradient(#000,#000) 0 9px/100% calc(100% - 9px) no-repeat;
  mask:
    radial-gradient(circle 9px at 9px 9px,#000 98%,transparent) 0 0/18px 18px repeat-x,
    linear-gradient(#000,#000) 0 9px/100% calc(100% - 9px) no-repeat;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
  animation:peekup 2.4s ease-in-out infinite;
}
.lace-env .card-in::before{
  content:"";position:absolute;inset:16px 12px auto 12px;height:0;
  border-top:2px dotted rgba(200,40,58,.35);
}
@keyframes peekup{50%{transform:translateY(-8px)}}

.polaroid{
  position:absolute;
  width:clamp(110px,17vw,190px);
  background:#fff;
  padding:8px 8px 34px;
  box-shadow:0 10px 22px rgba(0,0,0,.28);
  cursor:grab;
  touch-action:none;
  transition:box-shadow .2s, scale .2s;
  z-index:3;
}
.polaroid:active{cursor:grabbing;scale:1.06;box-shadow:0 20px 34px rgba(0,0,0,.35)}
.polaroid img,.polaroid .ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eee;pointer-events:none}
.polaroid figcaption{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:var(--hand);font-size:18px;color:#555}
.drag-hint{position:absolute;bottom:3%;right:4%;color:#fff;font-style:italic;font-size:16px;opacity:.85}

/* Placeholder foto kalau gambar belum ada */
.ph{
  display:grid !important;place-items:center;
  background:linear-gradient(135deg,#f9d7dc,#f3b3bd) !important;
  color:#b3263a;font-family:var(--hand);font-size:clamp(14px,2vw,20px);text-align:center;
}

/* Surat */
.letter-wrap{
  position:absolute;inset:0;z-index:40;
  display:grid;place-items:center;
  background:rgba(80,0,12,.55);backdrop-filter:blur(3px);
  opacity:0;visibility:hidden;transition:opacity .5s, visibility 0s .5s;
}
.letter-wrap.show{opacity:1;visibility:visible;transition:opacity .5s}
.letter{
  width:min(560px,90vw);max-height:84vh;overflow:auto;
  background:
    repeating-linear-gradient(180deg,transparent 0 31px,rgba(200,40,58,.13) 31px 32px),
    var(--paper);
  padding:40px 36px 34px;
  border-radius:4px;
  box-shadow:0 30px 60px rgba(0,0,0,.4);
  transform:translateY(60px) rotate(2deg);
  transition:transform .7s cubic-bezier(.3,1.4,.5,1);
  font-family:var(--hand);font-size:clamp(20px,2.6vw,25px);line-height:32px;color:#4a1016;
  position:relative;
}
.letter-wrap.show .letter{transform:none}
.letter .dear{font-family:var(--script);font-size:38px;color:var(--red);margin-bottom:8px;line-height:1.2}
.letter .sign{text-align:right;margin-top:18px;font-family:var(--script);font-size:32px;color:var(--red)}
.letter .close{position:absolute;top:10px;right:14px;font-size:26px;color:var(--red);font-family:var(--serif)}
.caret{display:inline-block;width:2px;height:1em;background:#4a1016;vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* =========================================================
   5. FLOWER — buket + pujian
   ========================================================= */
#flower{color:var(--cream)}
.bouquet-stage{position:relative;display:flex;flex-direction:column;align-items:center;z-index:2}
.bouquet-stage svg{width:clamp(170px,26vw,280px);height:auto;filter:drop-shadow(0 16px 20px rgba(0,0,0,.3));cursor:pointer;transition:transform .4s}
.bouquet-stage svg:hover{transform:rotate(-4deg) scale(1.03)}
.bouquet-stage .name{font-size:clamp(40px,6vw,60px);margin-top:4px}
.bouquet-stage .sub{font-style:italic;font-size:18px;opacity:.9}
.bouquet-stage .link{margin-top:18px}
#roses,#sunflowers{transition:opacity .6s, transform .6s}
#flower.bloom #roses{opacity:0;transform:scale(.6);position:absolute;pointer-events:none}
#flower:not(.bloom) #sunflowers{opacity:0;transform:scale(.6);position:absolute;pointer-events:none}
#flower:not(.bloom) .flower-text{opacity:0}
.flower-text{transition:opacity .6s .4s;text-align:center}
.tap-hint{font-style:italic;font-size:18px;margin-top:14px;animation:breathe 2s infinite}
#flower.bloom .tap-hint{display:none}

.notes{position:absolute;inset:0;pointer-events:none}
.note{
  position:absolute;
  max-width:min(230px,38vw);
  background:#fff;color:#5a0d14;
  padding:8px 12px;
  font-size:clamp(13px,1.7vw,17px);line-height:1.25;text-align:center;
  box-shadow:0 6px 14px rgba(0,0,0,.25);
  opacity:0;transform:scale(.4) rotate(0deg);
  transition:opacity .5s, transform .6s cubic-bezier(.3,1.6,.5,1);
  pointer-events:auto;
}
.note::before{ /* selotip */
  content:"";position:absolute;top:-9px;left:50%;width:46px;height:16px;translate:-50% 0;
  background:rgba(255,235,200,.75);rotate:-3deg;
}
#flower.bloom .note{opacity:1;transform:scale(1) rotate(var(--r))}

/* =========================================================
   6. CAKE — tiup lilin
   ========================================================= */
#cake{flex-direction:column;color:var(--cream);text-align:center}
#cake h2{font-size:clamp(40px,7vw,72px)}
#cake .wish{font-style:italic;font-size:clamp(16px,2.2vw,22px);margin-bottom:3vh;min-height:1.5em}
.big-cake{width:clamp(240px,34vw,360px);height:auto;filter:drop-shadow(0 20px 22px rgba(0,0,0,.35))}
.candle{cursor:pointer}
.flame{transform-origin:50% 100%;animation:flicker .25s ease-in-out infinite alternate;transition:opacity .4s, transform .4s}
@keyframes flicker{from{transform:scale(1,1) rotate(-2deg)}to{transform:scale(.9,1.1) rotate(2deg)}}
.candle.out .flame{opacity:0;transform:scale(.2);animation:none}
.smoke{opacity:0}
.candle.out .smoke{animation:smoke 1.4s ease-out forwards}
@keyframes smoke{0%{opacity:.8;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px) scale(2)}}
#cake .link{margin-top:3vh;opacity:0;pointer-events:none;transition:opacity .6s}
#cake.blown .link{opacity:1;pointer-events:auto}

/* =========================================================
   7. MEMORIES — scrapbook
   ========================================================= */
#memories .board{position:relative;width:min(1000px,96vw);height:min(620px,86vh)}
.gingham{
  position:absolute;left:8%;top:18%;width:52%;height:58%;
  background:
    repeating-linear-gradient(0deg,rgba(200,30,50,.45) 0 14px,transparent 14px 28px),
    repeating-linear-gradient(90deg,rgba(200,30,50,.45) 0 14px,transparent 14px 28px),
    #fff;
  rotate:-2deg;
  box-shadow:0 10px 20px rgba(0,0,0,.25);
  clip-path:polygon(0 3%,4% 0,12% 2%,22% 0,35% 3%,48% 0,60% 2%,72% 0,86% 3%,100% 0,98% 30%,100% 60%,97% 100%,80% 97%,62% 100%,45% 97%,30% 100%,12% 97%,0 100%,2% 60%,0 30%);
}
.mem{position:absolute;z-index:3}
.mem.frame{
  left:13%;top:22%;width:24%;aspect-ratio:1;
  background:#fff;padding:10px;border-radius:50%;
  box-shadow:0 8px 18px rgba(0,0,0,.3);
  rotate:-6deg;
}
.mem.frame img,.mem.frame .ph{width:100%;height:100%;object-fit:cover;border-radius:50%}
.mem.frame::after{content:"🎀";position:absolute;top:-14px;left:-6px;font-size:34px;rotate:-20deg}
.mem.clip{
  left:39%;top:12%;width:18%;
  background:#fff;padding:7px 7px 26px;rotate:4deg;
  box-shadow:0 8px 16px rgba(0,0,0,.28);
}
.mem.clip img,.mem.clip .ph{width:100%;aspect-ratio:4/5;object-fit:cover}
.mem.clip::before{
  content:"";position:absolute;top:-16px;left:50%;translate:-50% 0;
  width:34px;height:26px;border-radius:6px 6px 3px 3px;background:#c8283a;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.15);
}
.mini-vinyl{
  left:40%;top:56%;width:15%;aspect-ratio:1;cursor:pointer;
  border-radius:50%;
  background:repeating-radial-gradient(circle,#1a1a1a 0 2px,#2a2a2a 2px 4px);
  display:grid;place-items:center;
  box-shadow:0 8px 16px rgba(0,0,0,.4);
  animation:spin 6s linear infinite;
}
.mini-vinyl::after{content:"";width:34%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#111 0 8%,var(--red-soft) 9%)}
.mini-vinyl-label{
  position:absolute;left:56%;top:64%;z-index:4;
  font-family:var(--hand);font-size:clamp(16px,2vw,22px);color:#fff;
  rotate:-6deg;pointer-events:none;animation:breathe 2s ease-in-out infinite;
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}
@keyframes spin{to{rotate:360deg}}
.camera{
  left:2%;bottom:4%;width:24%;aspect-ratio:1.55;
  background:linear-gradient(180deg,#e9eef3,#c9d2da);
  border-radius:12px;padding:9% 30% 9% 7%;
  box-shadow:0 10px 20px rgba(0,0,0,.35);
  rotate:-6deg;
}
.camera .screen{position:absolute;left:7%;top:14%;right:30%;bottom:14%;border:4px solid #5c6670;border-radius:4px;overflow:hidden;background:#111}
.camera .screen img,.camera .screen .ph{width:100%;height:100%;object-fit:cover}
.camera .btns{position:absolute;right:8%;top:22%;display:grid;gap:8px;justify-items:center}
.camera .btns i{width:22px;height:22px;border-radius:50%;background:#aab4bd;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.camera .btns i:first-child{width:30px;height:30px;background:#9aa5af}
.strip{
  right:3%;top:4%;width:15%;
  background:#fff;padding:6px;display:grid;gap:6px;
  rotate:5deg;box-shadow:0 10px 20px rgba(0,0,0,.3);
}
.strip img,.strip .ph{width:100%;aspect-ratio:1.2;object-fit:cover}
.strip-2{right:19%;top:18%;rotate:-7deg;width:13%}
.xoxo{position:absolute;left:44%;bottom:10%;font-family:var(--hand);font-size:clamp(22px,3vw,34px);color:#fff;letter-spacing:.1em;rotate:-2deg}
.mem img{pointer-events:none}

/* =========================================================
   8. MUSIC — piringan hitam
   ========================================================= */
#music{color:var(--cream)}
.record{
  position:absolute;left:-12vmin;top:50%;translate:0 -50%;
  width:78vmin;aspect-ratio:1;border-radius:50%;
  background:
    conic-gradient(from 20deg,rgba(255,255,255,.07),transparent 15%,rgba(255,255,255,.1) 30%,transparent 45%,rgba(255,255,255,.06) 60%,transparent 75%,rgba(255,255,255,.08) 90%,transparent),
    repeating-radial-gradient(circle,#141414 0 2px,#1d1d1d 2px 4px);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  display:grid;place-items:center;
  animation:spin 4s linear infinite;
  animation-play-state:paused;
}
.record.playing{animation-play-state:running}
.record .label{
  width:34%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,#111 0 6%,#e2283b 7% 60%,#b5162a 61%);
  display:grid;place-items:center;
  overflow:hidden;
}
.record .label img{width:100%;height:100%;object-fit:cover;border-radius:50%;opacity:.95}
.player{
  position:relative;z-index:2;margin-left:auto;margin-right:6vw;
  width:min(440px,52vw);text-align:center;
}
.player h2{font-size:clamp(36px,6vw,62px)}
.player .song{font-size:clamp(18px,2.4vw,24px);font-style:italic;margin:8px 0 22px}
.play-btn{
  width:74px;height:74px;border-radius:50%;
  background:var(--cream);color:var(--red);
  display:inline-grid;place-items:center;font-size:28px;
  box-shadow:0 10px 24px rgba(0,0,0,.3);
  transition:transform .2s;
}
.play-btn:hover{transform:scale(1.08)}
.yt{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;margin-top:18px;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.notes-fly{position:absolute;inset:0;pointer-events:none;z-index:1}
.notes-fly span{position:absolute;font-size:26px;color:var(--cream);animation:floatnote 3s ease-out forwards}
@keyframes floatnote{from{opacity:1;transform:translate(0,0) rotate(0)}to{opacity:0;transform:translate(var(--dx),-140px) rotate(30deg)}}

/* =========================================================
   Efek: hati melayang & confetti
   ========================================================= */
#fx{position:fixed;inset:0;pointer-events:none;z-index:100}
.heart-pop{position:fixed;pointer-events:none;z-index:101;font-size:22px;animation:heartup 1.2s ease-out forwards}
@keyframes heartup{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(calc(-50% + var(--dx)),-140%) scale(1.4)}}

/* Tombol musik kecil */
#mute{
  position:fixed;right:16px;top:max(16px, env(safe-area-inset-top));z-index:60;
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.18);color:#fff;font-size:18px;backdrop-filter:blur(4px);
  display:none;place-items:center;
}
#mute.show{display:grid}

/* =========================================================

   ========================================================= */
@media (max-width:640px){

}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important}
}
</style>

Thank you for all the laughs, the late-night talks, and for simply being you. I hope this year brings you so many good days, new adventures, and lots of reasons to smile.

Never forget how loved you are. Have the sweetest birthday ever!`,

<script>
/* ===================== Navigasi ===================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
let current = "cover";

function go(id){
  if(id === current) return;
  $("#" + current).classList.remove("active");
  $("#" + id).classList.add("active");
  if(["message","flower","cake"].includes(id)) $("#g-" + id).classList.add("done");
  if(current === "music" && id !== "music") pauseSongVisual();
  current = id;
  onEnter[id]?.();
}
$$("[data-go]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); go(b.dataset.go); }));

/* ===================== Foto ===================== */
function placeholder(el, i){
  const d = document.createElement("div");
  d.className = "ph " + (el.className || "");
  d.innerHTML = ["📷","💗","🌷","✨","🎀","🍓"][i % 6] + "<br>photo " + (i + 1);
  el.replaceWith(d);
}
function setPhoto(img, i){
  const src = CONFIG.photos[i % CONFIG.photos.length];
  img.onerror = () => placeholder(img, i);
  img.src = src;
}
$$("img[data-photo]").forEach(img => setPhoto(img, +img.dataset.photo - 1));

function setBg(el, src, fallback){
  const t = new Image();
  t.onload = () => el.style.backgroundImage = `url("${src}")`;
  t.onerror = () => el.style.background = fallback;
  t.src = src;
}
setBg($("#heroBg"), CONFIG.heroPhoto, "radial-gradient(circle at 30% 30%,#e8697a,#7d0a16 70%)");
setBg($("#msgBg"), CONFIG.photos[1] || CONFIG.heroPhoto, "linear-gradient(135deg,#f6c1c8,#d77b88)");

/* ===================== 1. Cover ===================== */
$("#seal").addEventListener("click", e => {
  e.stopPropagation();
  $("#env").classList.add("open");
  burst(innerWidth / 2, innerHeight / 2, 120);
  setTimeout(() => go("hero"), 1700);
});

/* ===================== 2. Hero ===================== */
$("#heroDate").textContent = CONFIG.date;
$("#heroSub").textContent = CONFIG.subtitle;
const title = `Happy Birthday ${CONFIG.name}!`;
const onEnter = {
  hero(){
    const h = $("#heroTitle");
    h.innerHTML = [...title].map((c, i) =>
      `<span style="animation-delay:${i * 0.06}s">${c === " " ? "&nbsp;" : c}</span>`).join("");
    setTimeout(() => confettiRain(3500), 400);
  },
  message(){ layoutPolaroids(); },
  flower(){},
  cake(){},
  memories(){},
  music(){ playSong(); }
};

/* ===================== 4. Message ===================== */
const polWrap = $("#polaroids");
CONFIG.photos.slice(0, 4).forEach((_, i) => {
  const f = document.createElement("figure");
  f.className = "polaroid";
  f.innerHTML = `<img alt=""><figcaption>${CONFIG.captions[i] || ""}</figcaption>`;
  setPhoto(f.querySelector("img"), i);
  polWrap.appendChild(f);
  draggable(f);
});
let laidOut = false;
function layoutPolaroids(){
  if(laidOut) return; laidOut = true;
  const small = innerWidth < 640;
  const spots = small
    ? [[6,16,-8],[50,12,7],[10,40,5],[52,38,-6]]
    : [[34,10,-7],[62,6,6],[40,50,4],[66,46,-5]];
  $$(".polaroid").forEach((p, i) => {
    const [x, y, r] = spots[i];
    p.style.left = x + "%"; p.style.top = y + "%";
    p.style.rotate = r + "deg";
    p.animate([{opacity:0, transform:"translateY(-60px) scale(.8)"},{opacity:1, transform:"none"}],
      {duration:700, delay:i * 160, easing:"cubic-bezier(.3,1.5,.5,1)", fill:"backwards"});
  });
}
let zTop = 10;
function draggable(el){
  let sx, sy, ox, oy, moved;
  el.addEventListener("pointerdown", e => {
    e.stopPropagation();
    el.setPointerCapture(e.pointerId);
    sx = e.clientX; sy = e.clientY; ox = el.offsetLeft; oy = el.offsetTop; moved = false;
    el.style.zIndex = ++zTop;
  });
  el.addEventListener("pointermove", e => {
    if(!el.hasPointerCapture(e.pointerId)) return;
    moved = true;
    el.style.left = ox + e.clientX - sx + "px";
    el.style.top = oy + e.clientY - sy + "px";
  });
  el.addEventListener("pointerup", e => { if(!moved) hearts(e.clientX, e.clientY, 6); });
}

$("#dear").textContent = CONFIG.letterTo;
$("#sign").textContent = CONFIG.letterFrom;
let typing;
$("#laceEnv").addEventListener("click", e => {
  e.stopPropagation();
  $("#letterWrap").classList.add("show");
  const box = $("#letterText");
  clearInterval(typing);
  let i = 0; const txt = CONFIG.letter;
  box.innerHTML = '<span class="caret"></span>';
  typing = setInterval(() => {
    i += 1;
    box.innerHTML = txt.slice(0, i).replace(/\n/g, "<br>") + '<span class="caret"></span>';
    if(i >= txt.length){ clearInterval(typing); hearts(innerWidth / 2, innerHeight / 2, 14); }
  }, 32);
});
function closeLetter(e){ e.stopPropagation(); clearInterval(typing); $("#letterWrap").classList.remove("show"); }
$("#closeLetter").addEventListener("click", closeLetter);
$("#letterWrap").addEventListener("click", e => { if(e.target.id === "letterWrap") closeLetter(e); });

/* ===================== 5. Flower ===================== */
$("#flowerName").textContent = CONFIG.flowerName;
$("#flowerSub").textContent = CONFIG.flowerSub;
const noteSpots = [[4,16],[3,46],[5,76],[70,14],[71,44],[70,74]];
const noteSpotsSm = [[3,9],[3,74],[3,86],[52,9],[52,74],[52,86]];
CONFIG.compliments.forEach((c, i) => {
  const n = document.createElement("div");
  n.className = "note"; n.textContent = c;
  const [x, y] = (innerWidth < 640 ? noteSpotsSm : noteSpots)[i % 6];
  n.style.left = x + "%"; n.style.top = y + "%";
  n.style.setProperty("--r", (i % 2 ? 3 : -3) + "deg");
  n.style.transitionDelay = (0.3 + i * 0.18) + "s";
  $("#notes").appendChild(n);
});
$("#roses").addEventListener("click", e => {
  e.stopPropagation();
  $("#flower").classList.add("bloom");
  const r = e.currentTarget.getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 3, 60, ["#f6b919","#fff","#4f8a3f","#ffd86b"]);
});

/* ===================== 6. Cake ===================== */
const cg = $("#candles");
const n = CONFIG.candles;
for(let i = 0; i < n; i++){
  const x = 150 + (i - (n - 1) / 2) * (120 / Math.max(n - 1, 1));
  const col = ["#f48aa0","#ffd36b","#9ad0f5","#b9e4a7","#d7b5f2"][i % 5];
  cg.insertAdjacentHTML("beforeend", `
    <g class="candle" data-i="${i}">
      <rect x="${x - 6}" y="64" width="12" height="46" rx="3" fill="${col}"/>
      <path d="M${x - 6} 74l12 -6M${x - 6} 88l12 -6M${x - 6} 102l12 -6" stroke="#fff" stroke-width="3"/>
      <line x1="${x}" y1="64" x2="${x}" y2="56" stroke="#333" stroke-width="2"/>
      <g class="flame" style="transform-box:fill-box">
        <path d="M${x} 30c8 10 10 18 0 26-10-8-8-16 0-26z" fill="#ffb02e"/>
        <path d="M${x} 40c4 6 5 10 0 14-5-4-4-8 0-14z" fill="#fff3b0"/>
      </g>
      <circle class="smoke" cx="${x}" cy="48" r="6" fill="#ddd"/>
      <rect x="${x - 16}" y="20" width="32" height="92" fill="transparent"/>
    </g>`);
}
let blown = 0;
$$(".candle").forEach(c => c.addEventListener("click", e => {
  e.stopPropagation();
  if(c.classList.contains("out")) return;
  c.classList.add("out");
  blown++;
  if(blown === n){
    $("#cake").classList.add("blown");
    $("#wishText").textContent = CONFIG.wishDone;
    confettiRain(4000);
  }
}));

/* ===================== 8. Music ===================== */
const audio = $("#audio");
let hasAudio = false, ytPlayerShown = false;
$("#songTitle").textContent = CONFIG.songTitle;
if(CONFIG.songFile){
  audio.src = CONFIG.songFile;
  audio.addEventListener("canplay", () => { hasAudio = true; }, {once:true});
  audio.addEventListener("error", () => { hasAudio = false; });
}
function playSong(){
  if(hasAudio && !audio.paused){ setPlaying(true); }
  else if(hasAudio){
    audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
  } else if(CONFIG.youtubeId && !ytPlayerShown){
    ytPlayerShown = true;
    $("#playBtn").style.display = "none";
    $("#ytWrap").innerHTML = `<iframe class="yt" src="https://www.youtube.com/embed/${CONFIG.youtubeId}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    setPlaying(true);
  } else if(!CONFIG.youtubeId){
    setPlaying(true); // tetap putar piringannya biar lucu
  }
}
let noteTimer;
function setPlaying(on){
  $("#record").classList.toggle("playing", on);
  $("#playBtn").textContent = on ? "❚❚" : "▶";
  if(hasAudio && on) $("#mute").classList.add("show");
  clearInterval(noteTimer);
  if(on) noteTimer = setInterval(() => {
    const s = document.createElement("span");
    s.textContent = ["♪","♫","♬","♡"][Math.random() * 4 | 0];
    const r = $("#record").getBoundingClientRect();
    s.style.left = (r.left + r.width * (.5 + Math.random() * .4)) + "px";
    s.style.top = (r.top + r.height * (.3 + Math.random() * .4)) + "px";
    s.style.setProperty("--dx", (Math.random() * 120 - 20) + "px");
    $("#notesFly").appendChild(s);
    setTimeout(() => s.remove(), 3000);
  }, 450);
}
$("#playBtn").addEventListener("click", e => {
  e.stopPropagation();
  if(hasAudio){
    if(audio.paused) audio.play().then(() => setPlaying(true));
    else { audio.pause(); setPlaying(false); }
  } else {
    setPlaying(!$("#record").classList.contains("playing"));
  }
});
// Lagu tetap jalan saat keluar dari halaman musik; tombol ♪ untuk berhenti
$("#mute").addEventListener("click", e => {
  e.stopPropagation();
  if(audio.paused){ audio.play(); $("#mute").textContent = "♪"; }
  else { audio.pause(); $("#mute").textContent = "✕"; }
});
// keluar dari halaman musik: piringan berhenti, lagu tetap jalan
function pauseSongVisual(){ $("#record").classList.remove("playing"); clearInterval(noteTimer); }

// buka langsung halaman tertentu, misal index.html#menu
if(location.hash && $(location.hash + ".scene")) go(location.hash.slice(1));

/* ===================== Efek: hati & confetti ===================== */
function hearts(x, y, count = 1){
  for(let i = 0; i < count; i++){
    const h = document.createElement("div");
    h.className = "heart-pop";
    h.textContent = ["💗","💖","💕","❤️","🩷","✨"][Math.random() * 6 | 0];
    h.style.left = x + (Math.random() * 40 - 20) + "px";
    h.style.top = y + (Math.random() * 30 - 15) + "px";
    h.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
    h.style.animationDelay = i * 0.05 + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1500);
  }
}
// tap di mana saja = muncul hati (kayak like TikTok)
document.addEventListener("pointerdown", e => { if(!e.target.closest("button,.polaroid,.candle,#roses,#laceEnv,.letter")) hearts(e.clientX, e.clientY, 3); });

const cv = $("#fx"), ctx = cv.getContext("2d");
let parts = [], raining = 0;
function resize(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
resize(); addEventListener("resize", resize);
const COLORS = ["#ffd36b","#fff","#f48aa0","#ff4d6d","#d6a943","#ffc2d1"];
function addPart(x, y, vx, vy, colors = COLORS){
  parts.push({x, y, vx, vy, r: 4 + Math.random() * 5, a: Math.random() * 6, va: Math.random() * .3 - .15,
    c: colors[Math.random() * colors.length | 0], heart: Math.random() < .25, life: 1});
}
function burst(x, y, count = 80, colors){
  for(let i = 0; i < count; i++){
    const ang = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 8;
    addPart(x, y, Math.cos(ang) * sp, Math.sin(ang) * sp - 4, colors);
  }
  loop();
}
function confettiRain(ms){ raining = performance.now() + ms; loop(); }
let running = false;
function loop(){
  if(running) return; running = true;
  (function frame(t){
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if(t < raining) for(let i = 0; i < 3; i++) addPart(Math.random() * innerWidth, -10, Math.random() * 2 - 1, 2 + Math.random() * 2);
    parts = parts.filter(p => p.y < innerHeight + 20 && p.life > 0);
    for(const p of parts){
      p.vy += .15; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      if(p.heart){ ctx.font = p.r * 3 + "px serif"; ctx.fillText("♥", -p.r, p.r); }
      else ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
      ctx.restore();
    }
    if(parts.length || t < raining) requestAnimationFrame(frame);
    else { running = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
  })(performance.now());
}
</script>
